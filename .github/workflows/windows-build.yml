name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ compiled-app-dev ]
    paths:
      - 'src/**'
      - 'installer/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Run accounting regression checks
        run: dotnet run --project src/DukanHisab.Regression/DukanHisab.Regression.csproj -c Release

      - name: Publish self-contained Windows app
        run: dotnet publish src/DukanHisab.App/DukanHisab.App.csproj -c Release -r win-x64 --self-contained true -o out/publish

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc installer\DukanHisabNext.iss
          Get-FileHash out\installer\Setup-Dukan-Hisab-Next-Preview.exe -Algorithm SHA256 | Format-List

      - name: Publish preview installer as GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "next-preview-${{ github.run_number }}"
          gh release create $tag out\installer\Setup-Dukan-Hisab-Next-Preview.exe --target compiled-app-dev --prerelease --title "Dukan Hisab Next Preview ${{ github.run_number }}" --notes "Compiled .NET 8 WPF side-by-side preview. Smart PC v1.20 remains untouched. Accounting regression checks passed before this installer was built."
