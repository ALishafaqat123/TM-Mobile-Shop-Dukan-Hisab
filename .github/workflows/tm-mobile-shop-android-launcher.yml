name: TM Mobile Shop Android Launcher

on:
  workflow_dispatch:
  push:
    branches: [ compiled-app-dev ]
    paths:
      - '.github/workflows/tm-mobile-shop-android-launcher.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android app branch
        uses: actions/checkout@v4
        with:
          ref: android-tm-mobile-shop
          fetch-depth: 0

      - name: Mark build started
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > LATEST-ANDROID-RELEASE.txt <<STATUS
          STATUS=STARTED
          RUN_NUMBER=${GITHUB_RUN_NUMBER}
          RUN_ID=${GITHUB_RUN_ID}
          SOURCE_BRANCH=android-tm-mobile-shop
          STATUS
          git add LATEST-ANDROID-RELEASE.txt
          git commit -m "Android build started [skip ci]" || true
          git push origin HEAD:android-tm-mobile-shop

      - name: Repair Preview 5 UI if needed
        run: |
          if grep -qx 'PLACEHOLDER' app/src/main/assets/index.html; then
            python3 ci/repair_android_v5.py
            git add app/src/main/assets/index.html
            git commit -m "Restore Android minimal UI with Preview 5 fixes [skip ci]"
            git push origin HEAD:android-tm-mobile-shop
          fi
          grep -q "computerIncomeForDay" app/src/main/assets/index.html
          grep -q "accountPickerOverlay" app/src/main/assets/index.html
          if grep -q '<select' app/src/main/assets/index.html; then
            echo 'Native select popup still present'
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore stable signing key
        run: base64 -d ci/tm-mobile-shop.jks.b64 > ci/tm-mobile-shop.jks

      - name: Integrate Jameel Noori Nastaleeq font
        run: |
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/farid-786/fonts/ea4118d1d5d22cbdb8c628e6fc990f55b1c1148c/jameel-noori-nastaleeq/JameelNooriNastaleeq-Regular.woff2' \
            -o app/src/main/assets/JameelNooriNastaleeq.woff2
          test -s app/src/main/assets/JameelNooriNastaleeq.woff2
          ls -lh app/src/main/assets/JameelNooriNastaleeq.woff2

      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html').read_text()
          m=re.search(r'<script>(.*)</script>',p,re.S)
          if not m:
              raise SystemExit('script block not found')
          js=m.group(1)
          if "computer=n(actual.computer)-n(d.opening.computer)" in js:
              raise SystemExit('old computer profit formula still present')
          Path('/tmp/tm-mobile-shop.js').write_text(js)
          PY
          node --check /tmp/tm-mobile-shop.js

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace 2>&1 | tee /tmp/android-build.log

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk TM-Mobile-Shop-Preview.apk
          sha256sum TM-Mobile-Shop-Preview.apk > TM-Mobile-Shop-Preview-SHA256.txt
          ls -lh TM-Mobile-Shop-Preview.apk TM-Mobile-Shop-Preview-SHA256.txt

      - name: Publish preview release and success status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tm-mobile-shop-preview-${GITHUB_RUN_NUMBER}"
          SHA="$(cut -d' ' -f1 TM-Mobile-Shop-Preview-SHA256.txt)"
          gh release create "$TAG" TM-Mobile-Shop-Preview.apk TM-Mobile-Shop-Preview-SHA256.txt \
            --target android-tm-mobile-shop \
            --prerelease \
            --title "TM Mobile Shop Minimal Preview ${GITHUB_RUN_NUMBER}" \
            --notes "Minimal owner-first Android preview. Fixes computer profit split so old Reference computer cash is not treated as today's loss; replaces Android native account selector with an in-app Jameel Noori Nastaleeq picker; keeps closing-only profit, Smart Closing Check, Reference, note counting, History and Tanzeem. Android 8.1+."
          cat > LATEST-ANDROID-RELEASE.txt <<STATUS
          STATUS=SUCCESS
          TM Mobile Shop Minimal Preview ${GITHUB_RUN_NUMBER}
          TAG=${TAG}
          APK=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/TM-Mobile-Shop-Preview.apk
          SHA256=${SHA}
          RUN_ID=${GITHUB_RUN_ID}
          STATUS
          git add LATEST-ANDROID-RELEASE.txt
          git commit -m "Update Android minimal preview release status [skip ci]"
          git push origin HEAD:android-tm-mobile-shop

      - name: Record failure status
        if: failure()
        run: |
          {
            echo "STATUS=FAILED"
            echo "RUN_NUMBER=${GITHUB_RUN_NUMBER}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "--- BUILD LOG TAIL ---"
            if [ -f /tmp/android-build.log ]; then tail -n 80 /tmp/android-build.log; else echo "Build failed before Gradle log was created."; fi
          } > LATEST-ANDROID-RELEASE.txt
          git add LATEST-ANDROID-RELEASE.txt
          git commit -m "Record Android build failure [skip ci]" || true
          git push origin HEAD:android-tm-mobile-shop
