name: Build TM Mobile Shop Preview 10 Private APK

on:
  push:
    branches: [ android-preview-10-share-reports ]
    paths:
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview-10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Preview 10 branch
        uses: actions/checkout@v4
        with:
          ref: android-preview-10-share-reports
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        run: base64 -d ci/tm-mobile-shop.jks.b64 > ci/tm-mobile-shop.jks

      - name: Restore launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d ci/tm_app_icon_96.png.b64 > app/src/main/res/drawable-nodpi/tm_app_icon.png
          test -s app/src/main/res/drawable-nodpi/tm_app_icon.png

      - name: Restore Jameel Noori Nastaleeq font
        run: |
          curl -L --fail --retry 3             'https://raw.githubusercontent.com/farid-786/fonts/ea4118d1d5d22cbdb8c628e6fc990f55b1c1148c/jameel-noori-nastaleeq/JameelNooriNastaleeq-Regular.woff2'             -o app/src/main/assets/JameelNooriNastaleeq.woff2
          test -s app/src/main/assets/JameelNooriNastaleeq.woff2

      - name: Set private test APK version
        run: |
          sed -i "s/versionCode 8/versionCode 11/" app/build.gradle
          sed -i "s/versionName '1.7-preview-10-share-reports'/versionName '2.0-private-live-transactions'/" app/build.gradle

      - name: Verify accounting, sharing, and data safety
        run: |
          python3 - <<'PY'
          from pathlib import Path

          java = Path('app/src/main/java/com/tmmobileshop/hisab/MainActivity.java').read_text(encoding='utf-8')
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          gradle = Path('app/build.gradle').read_text(encoding='utf-8')
          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')

          assert "applicationId 'com.tmmobileshop.hisab'" in gradle
          assert "versionCode 11" in gradle
          assert "versionName '2.0-private-live-transactions'" in gradle
          assert 'android:label="TM Mobile Shop"' in manifest

          assert 'getSharedPreferences("tm_mobile_shop_store", MODE_PRIVATE)' in java
          assert '"state_json"' in java
          assert 'state_json_backup_pre_preview10' in java
          assert 'state_json_backup_pre_reconcile' in java
          assert 'state_json_backup_pre_customer_live' in java
          assert 'profitPartsForDayPatched' in java
          assert 'migrateComputerProfitSemantics' in java

          assert 'drawer:n(a.drawer)+n(a.computer),computer:0' in html
          assert 'openMultiShare' in html
          assert 'shareSelectedDays' in html
          assert 'combinedReportText' in html
          assert 'shareTextByMode' in html
          assert 'متعدد دن شیئر کریں' in html
          assert '*1) دکان میں پیسے آئے (+)*' in html
          assert '*2) دکان سے پیسے گئے (−)*' in html
          assert 'ایزی پیسہ شفاقت' in html
          assert "const PARTIES=" in html
          assert 'تنظم منیر' in html
          assert 'پیسے کس اکاؤنٹ میں آئے؟' in html
          assert 'پیسے کس اکاؤنٹ سے گئے؟' in html
          assert 'function reconciliationNumbers' in html
          assert 'function openReconcile' in html
          assert 'function saveReconciliation' in html
          assert '1) کل کا کل موجود' in html
          assert '2) آج کا کل موجود' in html
          assert '3) دکان میں باہر سے آئے پیسے' in html
          assert '4) دکان سے باہر گئے پیسے' in html
          assert 'حساب تصدیق شدہ' in html
          assert '*اختتامی کیش / بیلنس*' in html
          assert '*منافع*' in html
          assert '*حساب کیسے بنا*' in html
          assert 'تفصیل :۔' in html
          assert '۔۔۔۔۔۔۔ ختم شد ۔۔۔' in html
          assert 'id="pageLive"' in html
          assert 'لائیو اسٹیٹس' in html
          assert 'function renderLiveStatus' in html
          assert 'function liveBalanceFor' in html
          assert 'customerFlow:true' in html
          assert "counter:'drawer'" in html
          assert 'پیسے آئے (+)' in html
          assert 'پیسے گئے (−)' in html
          assert 'نوٹ (اختیاری)' in html

          # Regression checks using the real 28/29/30 totals discussed for the shop.
          def patched_profit(opening_total, actual_total, actual_computer, shop_to, to_shop):
              shop_opening = opening_total
              shop_actual = actual_total - actual_computer
              shop = shop_actual - shop_opening + shop_to - to_shop
              return shop + actual_computer

          p28 = patched_profit(187527, 181127, 2100, 13301, 500)
          p29 = patched_profit(181127, 184175, 2200, 53001, 50500)
          p30 = patched_profit(184175, 140246, 2400, 116000, 68000)
          assert p28 == 6401, p28
          assert p29 == 5549, p29
          assert p30 == 4071, p30
          assert p28 + p29 + p30 == 16021
          
          # Customer ledger invariant: account send/receive is balanced against cash,
          # so shop total is unchanged except any explicitly entered commission.
          jazz_ref = 50555
          drawer_ref = 100000
          jazz_live = jazz_ref - 1020 - 4950
          drawer_live = drawer_ref + 1020 + 4950
          assert jazz_live == 44585
          assert jazz_live + drawer_live == jazz_ref + drawer_ref

          jazz_live += 2000
          drawer_live -= 2000
          assert jazz_live == 46585
          assert jazz_live + drawer_live == jazz_ref + drawer_ref

          assert Path('app/src/main/assets/JameelNooriNastaleeq.woff2').stat().st_size > 1_000_000
          assert Path('app/src/main/res/drawable-nodpi/tm_app_icon.png').stat().st_size > 1_000

          print('PASS: package/storage identity preserved for in-place update')
          print('PASS: pre-Preview-10 state snapshot safeguard present')
          print('PASS: single-day + multi-day sharing UI/functions present')
          # Syntax-check the inline application JavaScript.
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/tm-mobile-shop-inline.js').write_text(script, encoding='utf-8')
          import subprocess
          subprocess.run(['node', '--check', '/tmp/tm-mobile-shop-inline.js'], check=True)

          print('PASS: party-aware incoming/outgoing reporting + reconciliation UI present')
          print('PASS: customer account ledger is cash-balanced and live-status hooks are present')
          print('PASS: inline JavaScript syntax check')
          print('PASS: day 28 profit=6401, day 29 profit=5549, day 30 profit=4071')
          PY

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk TM-Mobile-Shop-Preview-10.apk
          BYTES=$(stat -c%s TM-Mobile-Shop-Preview-10.apk)
          echo "APK_BYTES=$BYTES"
          if [ "$BYTES" -lt 1000000 ]; then
            echo "APK unexpectedly small; refusing to publish."
            exit 1
          fi
          sha256sum TM-Mobile-Shop-Preview-10.apk > TM-Mobile-Shop-Preview-10-SHA256.txt
          ls -lh TM-Mobile-Shop-Preview-10.apk TM-Mobile-Shop-Preview-10-SHA256.txt

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: TM-Mobile-Shop-Preview-10
          path: |
            TM-Mobile-Shop-Preview-10.apk
            TM-Mobile-Shop-Preview-10-SHA256.txt
