name: TM Mobile Shop Android

on:
  push:
    branches: [ android-tm-mobile-shop ]
    paths-ignore:
      - 'LATEST-ANDROID-RELEASE.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        run: base64 -d ci/tm-mobile-shop.jks.b64 > ci/tm-mobile-shop.jks

      - name: Validate Android accounting rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          java = Path('app/src/main/java/com/tmmobileshop/hisab/MainActivity.java').read_text(encoding='utf-8')
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')

          assert 'profitPartsForDayPatched' in java, 'Android computer-profit fix is missing from MainActivity'
          assert 'migrateComputerProfitSemantics' in java, 'saved-day profit migration is missing'
          assert 'drawer:n(a.drawer)+n(a.computer),computer:0' in html, 'next-day Computer-to-Drawer rollover rule changed'

          opening = dict(drawer=68600, computer=2700, jazz=87572, easyTanzeem=142076, easy=8680, oneload=2754)
          actual = dict(drawer=57050, computer=2300, jazz=80870, easyTanzeem=147072, easy=14180, oneload=1404)
          shop_opening = sum(opening.values()) - opening['computer']
          shop_actual = sum(actual.values()) - actual['computer']
          shop_profit = shop_actual - shop_opening + 13000
          computer_income = actual['computer']
          total_profit = shop_profit + computer_income

          assert shop_profit == 3894, shop_profit
          assert computer_income == 2300, computer_income
          assert total_profit == 6194, total_profit
          assert actual['drawer'] + actual['computer'] == 59350
          print('PASS shop profit = 3894')
          print('PASS computer income = 2300')
          print('PASS total profit = 6194')
          print('PASS next day: Computer amount joins Drawer and Computer resets to zero')
          PY

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/release/app-release.apk TM-Mobile-Shop-Preview.apk
          sha256sum TM-Mobile-Shop-Preview.apk > TM-Mobile-Shop-Preview-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TM-Mobile-Shop-Preview
          path: |
            TM-Mobile-Shop-Preview.apk
            TM-Mobile-Shop-Preview-SHA256.txt

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tm-mobile-shop-preview-${GITHUB_RUN_NUMBER}"
          SHA="$(cut -d' ' -f1 TM-Mobile-Shop-Preview-SHA256.txt)"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" TM-Mobile-Shop-Preview.apk TM-Mobile-Shop-Preview-SHA256.txt \
            --title "TM Mobile Shop Preview ${GITHUB_RUN_NUMBER}" \
            --notes "Android-only accounting fix. Computer on Home is today's computer income. Shop profit excludes the Computer opening/reference amount, total profit adds today's Computer income, and yesterday's Computer amount still rolls into the next day's Drawer while Computer resets to zero."
          cat > LATEST-ANDROID-RELEASE.txt <<STATUS
          TM Mobile Shop Preview ${GITHUB_RUN_NUMBER}
          TAG=${TAG}
          APK=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/TM-Mobile-Shop-Preview.apk
          SHA256=${SHA}
          RUN_ID=${GITHUB_RUN_ID}
          STATUS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST-ANDROID-RELEASE.txt
          git commit -m "Update Android preview release status [skip ci]"
          git push origin HEAD:android-tm-mobile-shop
